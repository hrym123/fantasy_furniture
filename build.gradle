buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm-tree:9.7'
    }
}

import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.tree.ClassNode

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    // 与 mapping_channel=parchment 配套；否则 GeckoLib 等 Mixin 在 dev 下无法对齐方法名
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    // GeckoLib 在 Forge 上使用 Mixin；须在开发环境应用该插件并重新生成运行配置（见 GeckoLib Wiki / Issue #440）
    id 'org.spongepowered.mixin' version '0.7.+'
}

// 共享脚本已含内容见 ../gradle/README.md；本文件仅保留模组差异（runs args、Jade、reobf、测试、refmap、generated）。
apply from: rootProject.file('../gradle/shared-forge-mod.gradle')

minecraft {
    runs {
        // 仅映射本模组源码；reverie_core 由 implementation project(':reverie_core') 的 JAR 提供（须为未 reobf 的 MCP 字节码；子工程 jar 若被 reobfJar 覆盖为 SRG 会导致 runClient NoSuchFieldError）。
        // 在子工程上再声明 reverie_core 的 source 时，部分 ForgeGradle 版本会把路径错绑到根工程 build/，导致 MOD_CLASSES 异常与 Mixin 配置读失败。
        // runs.configureEach（工作目录、日志、mods 源集）见 shared-forge-mod.gradle。

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--earlywindow.maximized', '--mixin.config=fantasy_furniture.mixins.json', '--mixin.config=reverie_core.mixins.json'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def imblockerCurseFileId = (findProperty('imblocker_curse_file_id') ?: '').toString().trim()

configurations {
    imblockerDeobfInbound {
        canBeConsumed = false
        canBeResolved = true
    }
}

repositories {
    // Jade / MaFgLib / Tweakerge：开发时 fg.deobf；IMBlocker 经 patch 后见下方（gradle.properties 非空才启用）
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

def imblockerPatchedJar = layout.buildDirectory.file("imblocker/imblocker-483760-${imblockerCurseFileId}-parchment-patched.jar")

// 剥离 WindowMixin 中有问题的 onScaleFactorChanged(I, CallbackInfo)（1.20.1 仅有 setGuiScale(double)，Mixin 会误绑导致崩溃）
def patchImblockerJar = imblockerCurseFileId.isEmpty() ? null : tasks.register('patchImblockerJar') {
    dependsOn configurations.imblockerDeobfInbound
    inputs.file(configurations.imblockerDeobfInbound.singleFile)
    outputs.file(imblockerPatchedJar)
    doLast {
        def inJar = configurations.imblockerDeobfInbound.singleFile
        def outFile = imblockerPatchedJar.get().asFile
        outFile.parentFile.mkdirs()
        def windowMixinPath = 'io/github/reserveword/imblocker/mixin/WindowMixin.class'
        def jf = new java.util.jar.JarFile(inJar)
        def jos = new java.util.jar.JarOutputStream(new java.io.FileOutputStream(outFile))
        try {
            jf.entries().each { e ->
                def ent = new java.util.jar.JarEntry(e.name)
                ent.time = e.time
                jos.putNextEntry(ent)
                if (e.name == windowMixinPath) {
                    def raw = jf.getInputStream(e).bytes
                    def reader = new ClassReader(raw)
                    def node = new ClassNode()
                    reader.accept(node, 0)
                    node.methods.removeIf { m ->
                        m.name == 'onScaleFactorChanged' &&
                            m.desc == '(ILorg/spongepowered/asm/mixin/injection/callback/CallbackInfo;)V'
                    }
                    def writer = new ClassWriter(ClassWriter.COMPUTE_MAXS)
                    node.accept(writer)
                    jos.write(writer.toByteArray())
                } else {
                    jf.getInputStream(e).withStream { ins -> ins.transferTo(jos) }
                }
                jos.closeEntry()
            }
        } finally {
            jos.close()
            jf.close()
        }
    }
}

dependencies {
    implementation project(':reverie_core')
    // 与 parchment 同映射反混淆，避免开发环境与 Curse/玩家端 jade 包不一致
    def jadeDeobf = fg.deobf("curse.maven:jade-324717:${jade_curse_file_id}")
    compileOnly jadeDeobf
    // 随 Minecraft Client 运行类路径与 run/mods 解析（Forge 用 runtimeOnly；非发行传递依赖）
    runtimeOnly jadeDeobf

    // Tweakerge 依赖 MaFgLib；二者均与 parchment 同映射反混淆
    def mafglibDeobf = fg.deobf("curse.maven:mafglib-910766:${mafglib_curse_file_id}")
    compileOnly mafglibDeobf
    runtimeOnly mafglibDeobf

    def tweakergeDeobf = fg.deobf("curse.maven:tweakerge-915857:${tweakerge_curse_file_id}")
    compileOnly tweakergeDeobf
    runtimeOnly tweakergeDeobf

    // IMBlocker：Curse 包在 Parchment userdev 下 int 版 setGuiScale 注入会误绑；patchImblockerJar 会剥离该回调后再加入类路径
    if (!imblockerCurseFileId.isEmpty()) {
        imblockerDeobfInbound fg.deobf("curse.maven:imblocker-483760:${imblockerCurseFileId}")
        compileOnly files(imblockerPatchedJar).builtBy(patchImblockerJar)
        runtimeOnly files(imblockerPatchedJar).builtBy(patchImblockerJar)
    }

    // JEI：全模组 / 单模组 runClient 随客户端运行；@JeiPlugin 在 reverie_core（API 为 compileOnly）
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    exclude 'org/lanye/fantasy_furniture/gametest/**'
    finalizedBy 'reobfJar'
}

mixin {
    add sourceSets.main, 'fantasy_furniture.refmap.json'
}

// runClient 通过 project 依赖使用 reverie_core 的 JAR（须含 client.model 等类）；若启动时 JAR 过旧会在渲染 Geolib 物品时 NoClassDefFoundError。
// 使用路径字符串 dependsOn，避免子工程 jar 尚未注册时 tasks.named('jar') 配置失败。
afterEvaluate {
    def rcJarPath = ':reverie_core:jar'
    tasks.matching { it.name in ['prepareRunClient', 'runClient', 'prepareRunServer', 'runServer', 'prepareRunGameTestServer', 'runGameTestServer'] }
            .configureEach { dependsOn(rcJarPath) }
}
